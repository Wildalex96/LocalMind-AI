name: v9.3.x Release

on:
  push:
    branches:
      - main
    tags:
      - 'v9.3.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          "version=$($pkg.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and -not $env:GITHUB_REF_NAME.StartsWith("v$env:PACKAGE_VERSION")) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match package version $env:PACKAGE_VERSION"
          }
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}

      - name: Run tests
        run: npm test

      - name: Build Windows installers
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
